name: Test
permissions:
  contents: read

on:
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository.
        uses: actions/checkout@v6
      - uses: ./.github/actions/install-deps
      - name: Test CI
        run: pnpm test:ci
  storybook:
    # Pinned: the Playwright version used by the stories has no Chromium build
    # for ubuntu-latest (26.04) yet. The image already ships Chromium and its
    # system dependencies, so there is no browser install step to hang on.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
    steps:
      - name: Checkout repository.
        uses: actions/checkout@v6
      - uses: ./.github/actions/install-deps
      - name: Test Storybook
        run: pnpm test:storybook
      - name: Build Storybook
        run: pnpm build-storybook
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository.
        uses: actions/checkout@v6
      - uses: ./.github/actions/install-deps
      - name: Fix ownership and mode
        run: sudo chown root /home/runner/work/HeroicGamesLauncher/HeroicGamesLauncher/node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 /home/runner/work/HeroicGamesLauncher/HeroicGamesLauncher/node_modules/electron/dist/chrome-sandbox
      - name: Test E2E
        run: pnpm test:e2e

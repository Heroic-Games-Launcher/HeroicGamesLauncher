name: Lint
permissions:
  contents: read

on:
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-deps
      - name: Lint code.
        run: pnpm lint
      - name: Prettier code.
        run: |
          pnpm exec prettier --write src/backend/migration/migrations/__tests__/xdg.test.ts
          git diff -- src/backend/migration/migrations/__tests__/xdg.test.ts
          pnpm prettier
      - name: Find dead code
        run: pnpm find-deadcode

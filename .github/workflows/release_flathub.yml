name: Draft Release Flathub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref_name:
        description: 'Release tag'
        required: true
      is_prerelease:
        description: 'Is this a pre-release/beta?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
  GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
  RELEASE_VERSION: ${{ github.event.release.tag_name || github.event.inputs.ref_name }}
  IS_PRERELEASE: ${{ github.event.release.prerelease || github.event.inputs.is_prerelease || 'false' }}

jobs:
  draft-releases:
    runs-on: ubuntu-latest
    steps:
      - name: echo ref name.
        run: echo "tag name $RELEASE_VERSION"
      - name: Checkout repository.
        uses: actions/checkout@v6
      - uses: ./.github/actions/install-deps
      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/
      - name: Checkout flathub repository.
        run: git clone https://github.com/flathub/com.heroicgameslauncher.hgl.git
      - name: Update flathub release
        run: pnpm release:updateFlathub:ci
      - name: Branch flathub repo
        run: git checkout -b "$RELEASE_VERSION"
        working-directory: ./com.heroicgameslauncher.hgl
      - name: Commit files to com.heroicgameslauncher.hgl
        run: |
          git config --local user.email "26871415+flavioislima@users.noreply.github.com"
          git config --local user.name "Flavio F Lima"
          git commit -a -m "changes for $RELEASE_VERSION"
        working-directory: ./com.heroicgameslauncher.hgl
      - name: Push updated flathub branch
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.WORKFLOW_TOKEN }}
          branch: ${{ env.RELEASE_VERSION }}
          directory: com.heroicgameslauncher.hgl
          repository: flathub/com.heroicgameslauncher.hgl
      - name: PR to flathub repo
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            sleep 5 && gh pr create --title "$RELEASE_VERSION" --body "$RELEASE_VERSION" --base beta --head "$RELEASE_VERSION"
          else
            sleep 5 && gh pr create --title "$RELEASE_VERSION" --body "$RELEASE_VERSION" --base master --head "$RELEASE_VERSION"
          fi
        working-directory: ./com.heroicgameslauncher.hgl
